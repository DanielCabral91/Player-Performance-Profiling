name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  pytest-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python python/generate_synthetic_profiles.py
      - run: pytest -q
      - run: python python/player_profiling_analysis.py

      - name: Verify generated files in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Commit reproducible demo data and outputs
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/synthetic_player_profiles.csv outputs/
          if ! git diff --cached --quiet; then
            git commit -m "Update generated demo outputs [skip ci]"
            git push
          fi
